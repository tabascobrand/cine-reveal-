<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMAL REVEAL — Devine l'animal</title>
<link rel="icon" type="image/png" href="favicon.ico.animal.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --panel: #12121a; --accent: #6abf69;
    --orange: #f5a623; --red: #e02d2d; --white: #f0eeea; --gray: #444455; --dim: #22222f;
  }
  body {
    background: var(--bg); color: var(--white); font-family: 'Inter', sans-serif;
    height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    align-items: center; padding: 0; overflow: hidden; position: relative;
  }
  body.score-visible {
    height: auto; min-height: 100vh; overflow-y: auto; position: static;
  }
  #screenEnd.active {
    display: flex; flex-direction: column; align-items: center;
    gap: 20px; width: 100%; max-width: none; padding: 30px 20px 60px;
  }
  header {
    width: 100%; padding: 18px 32px; display: flex;
    align-items: center; justify-content: space-between; border-bottom: 1px solid #1e1e2e;
    flex-shrink: 0;
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 4px; color: var(--accent); cursor: pointer; }
  .logo span { color: var(--white); }
  .score-display { display: flex; flex-direction: column; align-items: flex-end; }
  .score-label { font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: var(--gray); }
  .score-value { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--accent); line-height: 1; }
  .progress-bar-wrap { width: 100%; height: 5px; display: flex; gap: 3px; flex-shrink: 0; }
  .progress-seg { flex: 1; height: 100%; background: var(--dim); border-radius: 1px; transition: background 0.3s ease; }
  .progress-seg.pg-correct { background: #4caf6e; }
  .progress-seg.pg-missed { background: #e2564f; }
  .progress-seg.pg-partial { background: var(--orange); }
  .game-area {
    width: 100%; max-width: 700px; padding: 16px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    flex: 1; overflow: hidden;
  }
  @media (max-height: 500px) {
    .game-area { padding: 8px 16px; gap: 8px; }
    .photo-container { max-height: 32vh; max-height: 32dvh; }
    header { padding: 8px 20px; }
  }
  .round-info {
    display: flex; justify-content: space-between; width: 100%;
    font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent);
  }
  .photo-container {
    position: relative; width: 100%; max-width: 340px; aspect-ratio: 2/3;
    flex-shrink: 1; min-height: 0;
    max-height: calc(100vh - 280px); max-height: calc(100dvh - 280px);
    margin: 0 auto;
    background: #000; overflow: hidden; border: 2px solid #1e1e2e; transition: border-color 0.2s;
  }
  .photo-container.flash-correct { border-color: var(--accent); }
  .photo-container.flash-half   { border-color: var(--orange); }
  .photo-container.flash-wrong  { border-color: var(--red); }
  .photo-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo-img.hide  { visibility: hidden; }
  .photo-img.ready { visibility: visible; }
  .reveal-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .pts-badge {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.8); border: 1px solid var(--accent);
    color: var(--accent); font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem; padding: 4px 10px; letter-spacing: 2px;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    transition: all 0.3s;
  }
  .pts-badge .pts-fixed { font-size: 0.65rem; letter-spacing: 1px; opacity: 0.7; }
  .pts-badge .pts-bonus { font-size: 1.1rem; }
  .pts-badge.half { border-color: var(--orange); color: var(--orange); }
  .timer-wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 6px; }
  .timer-row { display: flex; justify-content: space-between; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); }
  .timer-bar { width: 100%; height: 4px; background: var(--dim); border-radius: 2px; overflow: hidden; }
  .timer-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.1s linear, background 0.3s; }
  .timer-fill.urgent { background: var(--red); }
  .input-wrap { width: 100%; max-width: 440px; display: flex; gap: 10px; }
  .input-wrap input {
    flex: 1; background: var(--panel); border: 1px solid var(--gray); border-radius: 2px;
    color: var(--white); font-size: 1rem; font-family: 'Inter', sans-serif;
    padding: 12px 16px; outline: none; transition: border-color 0.2s;
  }
  .input-wrap input:focus { border-color: var(--accent); }
  .input-wrap input.correct { border-color: var(--accent); background: #0d1e1e; }
  .input-wrap input.half    { border-color: var(--orange); background: #1e1200; }
  .input-wrap input.wrong   { border-color: var(--red); background: #200d0d; }
  .btn-skip {
    background: transparent; border: 1px solid var(--gray); color: var(--gray);
    font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
    padding: 0 16px; cursor: pointer; transition: all 0.2s; border-radius: 2px;
  }
  .btn-skip:hover { border-color: var(--white); color: var(--white); }
  .feedback { font-size: 0.8rem; letter-spacing: 1px; height: 20px; color: var(--gray); }
  .feedback.ok    { color: var(--accent); }
  .feedback.half  { color: var(--orange); }
  .feedback.ko    { color: var(--red); }
  .feedback.fuzzy { color: #a0e8e4; }
  .screen {
    display: none; width: 100%; max-width: 440px;
    flex-direction: column; align-items: center; gap: 20px;
    padding: 40px 20px; text-align: center;
  }
  .screen.active { display: flex; }
  .screen-title { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 6px; color: var(--accent); }
  .screen-sub { color: var(--gray); font-size: 0.85rem; letter-spacing: 1px; line-height: 1.6; }
  .btn-primary {
    background: var(--accent); color: #000; font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem; letter-spacing: 3px; border: none; padding: 14px 40px;
    cursor: pointer; transition: opacity 0.2s; margin-top: 8px;
  }
  .btn-primary:hover { opacity: 0.85; }

  /* ── Leaderboard (aperçu grisé, non fonctionnel) ── */
  .leaderboard-preview {
    width: 100%; max-width: 440px; margin-top: 44px;
    opacity: 0.5; pointer-events: none; user-select: none;
  }
  .leaderboard-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 4px;
    text-align: center; color: var(--gray); margin-bottom: 6px;
  }
  .leaderboard-soon {
    font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase;
    text-align: center; color: var(--gray); margin-bottom: 18px;
  }
  .leaderboard-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; background: var(--panel); border-left: 3px solid var(--dim);
    margin-bottom: 8px;
  }
  .leaderboard-rank {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; color: var(--gray); width: 22px;
  }
  .leaderboard-name {
    flex: 1; font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px;
    font-size: 1.05rem; color: var(--white);
  }
  .leaderboard-score {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; color: var(--gray);
  }

  /* ── Mise en page deux colonnes de l'écran de fin (résultats / classement) ── */
  .end-columns {
    display: flex; gap: 36px; width: 100%; max-width: 1000px;
    align-items: flex-start;
  }
  .end-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  .end-col-leaderboard .leaderboard-preview { margin-top: 0; max-width: 100%; }
  @media (max-width: 760px) {
    .end-columns { flex-direction: column; }
  }

  .final-breakdown { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .breakdown-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: var(--panel); border-left: 3px solid var(--dim); font-size: 0.85rem;
  }
  .breakdown-row.scored { border-left-color: var(--accent); }
  .breakdown-row.half-scored { border-left-color: var(--orange); }
  .breakdown-row.missed { border-left-color: var(--red); }
  .breakdown-row .pts { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; color: var(--accent); }
  .breakdown-row.half-scored .pts { color: var(--orange); }
  .breakdown-row.missed .pts { color: var(--red); }
  @keyframes shake {
    0%,100%{ transform:translateX(0); } 15%{ transform:translateX(-7px); }
    30%{ transform:translateX(7px); } 45%{ transform:translateX(-5px); }
    60%{ transform:translateX(5px); } 75%{ transform:translateX(-3px); } 90%{ transform:translateX(3px); }
  }
  .photo-container.shaking { animation: shake 0.4s ease; }
  @keyframes flashCorrect {
    0%{ box-shadow:0 0 0 0 rgba(78,205,196,0.5); }
    50%{ box-shadow:0 0 0 20px rgba(78,205,196,0); }
    100%{ box-shadow:none; }
  }
  .photo-container.correct-flash { animation: flashCorrect 0.6s ease; }
  @keyframes flashHalf {
    0%{ box-shadow:0 0 0 0 rgba(245,166,35,0.5); }
    50%{ box-shadow:0 0 0 20px rgba(245,166,35,0); }
    100%{ box-shadow:none; }
  }
  .photo-container.half-flash { animation: flashHalf 0.6s ease; }
  .score-popup {
    position: fixed; top: 42%; left: 50%;
    font-family: 'Bebas Neue', sans-serif; font-size: 3.4rem; letter-spacing: 3px;
    color: var(--accent); text-shadow: 0 0 24px rgba(106,191,105,0.65), 0 2px 6px rgba(0,0,0,0.85);
    pointer-events: none; opacity: 0; z-index: 200; white-space: nowrap;
    transform: translate(-50%, -50%) scale(0.7);
  }
  .score-popup.show { animation: scorePop 1.1s cubic-bezier(.2,.9,.3,1) forwards; }
  .score-popup-sub {
    font-size: 0.22em; letter-spacing: 2px; opacity: 0.7;
    margin-top: 4px; text-align: center;
  }
  @keyframes scorePop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.18); }
    28%  { transform: translate(-50%, -50%) scale(1); }
    72%  { opacity: 1; transform: translate(-50%, calc(-50% - 34px)) scale(1); }
    100% { opacity: 0; transform: translate(-50%, calc(-50% - 64px)) scale(0.92); }
  }

  /* ── Mini-badge de série, collé au bord du cadre ── */
  .streak-mini {
    position: absolute; top: 10px; right: -8px; transform: translateX(100%);
    display: none; align-items: baseline; gap: 2px;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,106,61,0.4); border-radius: 4px;
    padding: 4px 8px; margin-left: 6px; z-index: 20;
    font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px;
    opacity: 0; transition: opacity 0.3s;
  }
  .streak-mini.show { opacity: 0.7; }
  .streak-mini .streak-mini-count { font-size: 0.95rem; color: #ff6a3d; }
  .streak-mini .streak-mini-max { font-size: 0.68rem; color: var(--gray); }
  .streak-mini.pulse { animation: streakMiniPulse 0.35s ease; }
  @keyframes streakMiniPulse {
    0%   { transform: translateX(100%) scale(1); }
    45%  { transform: translateX(100%) scale(1.3); }
    100% { transform: translateX(100%) scale(1); }
  }

  /* ── Couche d'effets sobres pour les paliers de série ── */
  .streak-fx { position: fixed; inset: 0; pointer-events: none; z-index: 150; overflow: hidden; }
  .streak-glow {
    position: absolute; top: 42%; left: 50%; width: 280px; height: 280px;
    transform: translate(-50%,-50%); border-radius: 50%;
    background: radial-gradient(circle, var(--glow-color, rgba(255,106,61,0.35)) 0%, transparent 72%);
    opacity: 0;
    animation: streakGlowPulse 1s ease-out forwards;
  }
  @keyframes streakGlowPulse {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
    30%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.6); }
  }
  .streak-ring {
    position: absolute; top: 42%; left: 50%; width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--ring-color, #ff6a3d);
    transform: translate(-50%,-50%) scale(1); opacity: 0.85;
    animation: streakRingExpand 0.9s ease-out forwards;
  }
  @keyframes streakRingExpand {
    0%   { transform: translate(-50%,-50%) scale(1); opacity: 0.85; }
    100% { transform: translate(-50%,-50%) scale(42); opacity: 0; }
  }
  .streak-heaven-wash {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(255,251,232,0.55) 0%, rgba(255,215,120,0.16) 45%, rgba(255,251,232,0) 75%);
    opacity: 0;
    animation: streakHeavenWash 3.8s ease-in-out forwards;
  }
  @keyframes streakHeavenWash {
    0%   { opacity: 0; }
    15%  { opacity: 1; }
    75%  { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:14px">
    <div class="logo" onclick="goHome()">ANIMAL<span>REVEAL</span></div>
    <button id="soundBtn" onclick="toggleSound()" title="Son ambiance" style="background:transparent;border:none;cursor:pointer;padding:4px;color:var(--accent);display:flex;align-items:center;transition:color 0.2s;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path id="wave1" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path id="wave2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </button>
  </div>
  <div class="score-display">
    <div class="score-label">Score</div>
    <div class="score-value" id="headerScore">0</div>
  </div>
</header>
<div class="progress-bar-wrap" id="progressBarWrap"></div>
<div class="score-popup" id="scorePopup"></div>
<div class="streak-fx" id="streakFX"></div>

<div class="screen active" id="screenStart">
  <div class="screen-title">ANIMAL REVEAL</div>
  <button class="btn-primary" onclick="startGame()">JOUER</button>
  <div class="leaderboard-preview">
    <div class="leaderboard-title">CLASSEMENT MONDIAL</div>
    <div class="leaderboard-soon">Bientôt disponible</div>
    <div class="leaderboard-row"><span class="leaderboard-rank">1</span><span class="leaderboard-name">BAZOOKA12</span><span class="leaderboard-score">8420</span></div>
    <div class="leaderboard-row"><span class="leaderboard-rank">2</span><span class="leaderboard-name">LUCIE_R</span><span class="leaderboard-score">7150</span></div>
    <div class="leaderboard-row"><span class="leaderboard-rank">3</span><span class="leaderboard-name">MAXPLAYER</span><span class="leaderboard-score">6800</span></div>
    <div class="leaderboard-row"><span class="leaderboard-rank">4</span><span class="leaderboard-name">NOVA</span><span class="leaderboard-score">5990</span></div>
    <div class="leaderboard-row"><span class="leaderboard-rank">5</span><span class="leaderboard-name">ZEPHYR</span><span class="leaderboard-score">5410</span></div>
  </div>
</div>

<div class="game-area" id="gameArea" style="display:none">
  <div class="round-info">
    <span id="roundLabel">ANIMAL 1 / 20</span>
    <span id="revealPct">0% révélé</span>
  </div>
  <div class="photo-container" id="photoContainer">
    <img class="photo-img hide" id="photoImg" src="" alt="animal">
    <canvas class="reveal-mask" id="revealCanvas"></canvas>
    <div id="animalTitle" style="
      position:absolute; bottom:0; left:0; right:0;
      background:rgba(0,0,0,0.72); color:#f0eeea;
      font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:2px;
      text-align:center; padding:7px 12px;
      display:none; text-transform:uppercase; line-height:1.4;
    "></div>
    <div class="streak-mini" id="streakMini">
      <span class="streak-mini-count" id="streakMiniCount">0</span><span class="streak-mini-max">/10</span>
    </div>
    <div class="pts-badge" id="ptsBadge">
      <div class="pts-fixed" id="ptsFixed"></div>
      <div class="pts-bonus" id="ptsBonus">+50</div>
    </div>
  </div>
  <div class="timer-wrap">
    <div class="timer-row"><span>RÉVÉLATION</span><span id="timerLabel">0%</span></div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
  </div>
  <div class="input-wrap">
    <input type="text" id="answerInput" placeholder="Nom de l'animal… (Entrée pour valider)" autocomplete="off" spellcheck="false">
    <button class="btn-skip" id="skipBtn" onclick="skipAnimal()">PASSER</button>
  </div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="screen" id="screenEnd">
  <div class="screen-title" id="endTitle">RÉSULTAT</div>
  <div class="screen-sub" id="endSub"></div>
  <div class="end-columns">
    <div class="end-col end-col-results">
      <div class="final-breakdown" id="breakdown"></div>
    </div>
    <div class="end-col end-col-leaderboard">
      <div class="leaderboard-preview">
        <div class="leaderboard-title">CLASSEMENT MONDIAL</div>
        <div class="leaderboard-soon">Bientôt disponible</div>
        <div class="leaderboard-row"><span class="leaderboard-rank">1</span><span class="leaderboard-name">BAZOOKA12</span><span class="leaderboard-score">8420</span></div>
        <div class="leaderboard-row"><span class="leaderboard-rank">2</span><span class="leaderboard-name">LUCIE_R</span><span class="leaderboard-score">7150</span></div>
        <div class="leaderboard-row"><span class="leaderboard-rank">3</span><span class="leaderboard-name">MAXPLAYER</span><span class="leaderboard-score">6800</span></div>
        <div class="leaderboard-row"><span class="leaderboard-rank">4</span><span class="leaderboard-name">NOVA</span><span class="leaderboard-score">5990</span></div>
        <div class="leaderboard-row"><span class="leaderboard-rank">5</span><span class="leaderboard-name">ZEPHYR</span><span class="leaderboard-score">5410</span></div>
      </div>
    </div>
  </div>
  <button class="btn-primary" onclick="restartGame()">REJOUER</button>
</div>

<script>
const AC = new (window.AudioContext || window.webkitAudioContext)();

function playWrong() {
  const buf=AC.createBuffer(1,AC.sampleRate*0.18,AC.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,1.5);
  const src=AC.createBufferSource(); src.buffer=buf;
  const g=AC.createGain(); g.gain.setValueAtTime(0.55,AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.22);
  const bq=AC.createBiquadFilter(); bq.type='bandpass'; bq.frequency.setValueAtTime(280,AC.currentTime); bq.frequency.exponentialRampToValueAtTime(80,AC.currentTime+0.18); bq.Q.value=1.2;
  src.connect(bq); bq.connect(g); g.connect(AC.destination); src.start();
}

function playCorrect() {
  const t = AC.currentTime;
  function makeReverb(dur,decay){
    const len=AC.sampleRate*dur; const buf=AC.createBuffer(2,len,AC.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
    const conv=AC.createConvolver(); conv.buffer=buf; return conv;
  }
  const reverb=makeReverb(2.0,2.2); const reverbGain=AC.createGain(); reverbGain.gain.value=0.32;
  reverb.connect(reverbGain); reverbGain.connect(AC.destination);
  const master=AC.createGain(); master.gain.value=0.055;
  master.connect(AC.destination); master.connect(reverb);
  const delay=AC.createDelay(0.7); delay.delayTime.value=0.3;
  const delayGain=AC.createGain(); delayGain.gain.value=0.18;
  delay.connect(delayGain); delayGain.connect(master);
  function playFlute(freq,start,dur,vol){
    const osc=AC.createOscillator(); const g=AC.createGain();
    osc.type='sine'; osc.frequency.setValueAtTime(freq,start);
    osc.frequency.linearRampToValueAtTime(freq*1.003,start+dur*0.7);
    g.gain.setValueAtTime(0,start); g.gain.linearRampToValueAtTime(vol,start+0.05);
    g.gain.setValueAtTime(vol*0.85,start+dur*0.55); g.gain.exponentialRampToValueAtTime(0.001,start+dur);
    osc.connect(g); g.connect(master); g.connect(delay); osc.start(start); osc.stop(start+dur+0.1);
    const bLen=Math.floor(AC.sampleRate*dur); const bBuf=AC.createBuffer(1,bLen,AC.sampleRate);
    const bd=bBuf.getChannelData(0);
    for(let i=0;i<bLen;i++) bd[i]=(Math.random()*2-1)*Math.pow(1-i/bLen,1.8)*0.018;
    const breath=AC.createBufferSource(); breath.buffer=bBuf;
    const bpf=AC.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=freq*2.2; bpf.Q.value=1.2;
    const bg=AC.createGain(); bg.gain.value=vol*0.35;
    breath.connect(bpf); bpf.connect(bg); bg.connect(master); breath.start(start);
  }
  playFlute(523.25,t,0.55,1.0);
  playFlute(659.25,t+0.15,0.50,0.75);
  playFlute(783.99,t+0.28,0.60,0.55);
}

function playHalf() {
  // Son intermédiaire — une seule note douce
  const t = AC.currentTime;
  const osc = AC.createOscillator(); const g = AC.createGain();
  osc.type = 'sine'; osc.frequency.value = 659.25;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.07,t+0.04);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
  osc.connect(g); g.connect(AC.destination); osc.start(t); osc.stop(t+0.45);
}

function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function normalize(str){ return str.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,''); }
function isFuzzyMatch(input,target){
  const a=normalize(input),b=normalize(target);
  if(a===b) return 'exact';
  const dist=levenshtein(a,b);
  const maxDist=b.length<=5?1:b.length<=10?2:3;
  return dist<=maxDist?'fuzzy':false;
}

// Vérifie si l'input matche une des alias, soit dans son ensemble (comportement d'origine),
// soit via l'un de ses mots pris isolément (permet de créditer "flamant" dans "flamant bleu")
function matchesAnyAlias(inputRaw, aliases){
  let matched=false, fuzzy=false;
  for(const a of aliases){
    const r=isFuzzyMatch(inputRaw,a);
    if(r==='exact') return {matched:true, fuzzy:false};
    if(r==='fuzzy'){ matched=true; fuzzy=true; }
  }
  const tokens=inputRaw.trim().split(/\s+/).filter(Boolean);
  if(tokens.length>1){
    for(const tok of tokens){
      for(const a of aliases){
        const r=isFuzzyMatch(tok,a);
        if(r==='exact') return {matched:true, fuzzy:false};
        if(r==='fuzzy'){ matched=true; fuzzy=true; }
      }
    }
  }
  return {matched, fuzzy};
}

let globalQueue = [];
let lastSession = [];

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function getNextSession(){
  if(globalQueue.length < SESSION_SIZE){
    // Nouveau mélange en excluant les animaux de la dernière session autant que possible
    let pool = shuffle(shuffle([...ANIMALS]));
    // Pousser les animaux récents à la fin
    const recent = new Set(lastSession.map(a=>a.title));
    const front = pool.filter(a=>!recent.has(a.title));
    const back  = pool.filter(a=> recent.has(a.title));
    pool = shuffle(front).concat(shuffle(back));
    globalQueue = pool;
  }
  const session = globalQueue.slice(0, SESSION_SIZE);
  globalQueue = globalQueue.slice(SESSION_SIZE);
  lastSession = session;
  return session;
}

let queue, currentIdx, totalScore, roundScores;
let revealPct = 0, revealInterval = null, answered = false;
let bonusCaptured = false, currentBonus = BONUS_MAX;
// Pour les noms doubles : suivi des parties trouvées
let part1Found = false, part2Found = false;
// Série de bonnes réponses consécutives
let streak = 0;
const STREAK_BONUSES = {3:220, 6:440, 10:2000};

// ── Indicateur de série, collé au cadre de la photo ──
function updateStreakIndicator(){
  const el=document.getElementById('streakMini');
  const countEl=document.getElementById('streakMiniCount');
  if(streak>0){
    countEl.textContent=streak;
    el.style.display='flex';
    el.classList.add('show');
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
  } else {
    el.classList.remove('show');
    setTimeout(()=>{ if(streak===0) el.style.display='none'; }, 300);
  }
}

// ── Sons de palier de série ──
function playGong(){
  const t=AC.currentTime;
  const master=AC.createGain(); master.gain.value=0.35; master.connect(AC.destination);
  [112,175,233,311,389].forEach((f,i)=>{
    const osc=AC.createOscillator(); osc.type='sine'; osc.frequency.value=f*(1+Math.random()*0.01);
    const g=AC.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.5/(i+1), t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t+2.4-i*0.15);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t+2.5);
  });
  const nBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*0.08),AC.sampleRate);
  const nd=nBuf.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*Math.pow(1-i/nd.length,2);
  const noise=AC.createBufferSource(); noise.buffer=nBuf;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.8;
  const ng=AC.createGain(); ng.gain.value=0.4;
  noise.connect(bp); bp.connect(ng); ng.connect(master);
  noise.start(t);
}
function playStreakSynth(){
  const t=AC.currentTime;
  const osc=AC.createOscillator(); osc.type='sawtooth'; osc.frequency.setValueAtTime(392,t);
  const filter=AC.createBiquadFilter(); filter.type='lowpass'; filter.frequency.setValueAtTime(300,t);
  filter.frequency.linearRampToValueAtTime(2200,t+0.15);
  filter.frequency.exponentialRampToValueAtTime(400,t+0.8);
  const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.3,t+0.03); g.gain.exponentialRampToValueAtTime(0.001,t+0.9);
  osc.connect(filter); filter.connect(g); g.connect(AC.destination);
  osc.start(t); osc.stop(t+0.95);
}
function playChoir(){
  const t=AC.currentTime;
  const master=AC.createGain(); master.gain.value=0; master.connect(AC.destination);
  master.gain.setValueAtTime(0,t);
  master.gain.linearRampToValueAtTime(0.18,t+0.8);
  master.gain.setValueAtTime(0.18,t+2.6);
  master.gain.linearRampToValueAtTime(0,t+4.2);
  [523.25,659.25,783.99,987.77].forEach((f,i)=>{
    const osc=AC.createOscillator(); osc.type='triangle'; osc.frequency.setValueAtTime(f,t);
    const lfo=AC.createOscillator(); lfo.frequency.value=4+i*0.3;
    const lfoGain=AC.createGain(); lfoGain.gain.value=2.5;
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
    lfo.start(t); lfo.stop(t+4.4);
    const g=AC.createGain(); g.gain.value=0.5/(i+1);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t+4.4);
  });
}

  const el=document.createElement('div');
  el.className='streak-glow';
  el.style.setProperty('--glow-color', color);
  el.style.animationDelay=(delay||0)+'s';
  container.appendChild(el);
  setTimeout(()=>el.remove(), ((delay||0)+1.1)*1000);
}
function spawnRing(container, color, delay){
  const el=document.createElement('div');
  el.className='streak-ring';
  el.style.setProperty('--ring-color', color);
  el.style.animationDelay=(delay||0)+'s';
  container.appendChild(el);
  setTimeout(()=>el.remove(), ((delay||0)+1)*1000);
}
function spawnHeavenWash(container){
  const el=document.createElement('div');
  el.className='streak-heaven-wash';
  container.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}

function triggerStreakCelebration(tier, bonus){
  const fx=document.getElementById('streakFX');
  if(tier===3){
    showScorePopup('+'+bonus,'streak','3/3');
    playGong();
    spawnGlow(fx,'rgba(255,106,61,0.35)',0);
  } else if(tier===6){
    showScorePopup('+'+bonus,'streak','6/6');
    playStreakSynth();
    spawnGlow(fx,'rgba(255,106,61,0.4)',0);
    spawnRing(fx,'#ff6a3d',0.05);
  } else if(tier===10){
    showScorePopup('+'+bonus,'streak-heaven','10/10');
    playChoir();
    spawnHeavenWash(fx);
  }
}

function handleStreakSuccess(){
  streak++;
  const streakAtThisAnswer = streak; // figé immédiatement, insensible aux réponses suivantes
  updateStreakIndicator();
  const bonus = STREAK_BONUSES[streakAtThisAnswer];
  if(bonus){
    totalScore+=bonus;
    document.getElementById('headerScore').textContent=totalScore;
    setTimeout(()=>{ triggerStreakCelebration(streakAtThisAnswer, bonus); }, 650);
  }
}
function handleStreakBreak(){ streak=0; updateStreakIndicator(); }

function initProgressSegments(){
  const wrap=document.getElementById('progressBarWrap');
  wrap.innerHTML='';
  for(let i=0;i<SESSION_SIZE;i++){
    const seg=document.createElement('div');
    seg.className='progress-seg';
    seg.id='progressSeg'+i;
    wrap.appendChild(seg);
  }
}
function markProgressSegment(index, status){
  const seg=document.getElementById('progressSeg'+index);
  if(!seg) return;
  if(status==='partial') seg.classList.add('pg-partial');
  else seg.classList.add(status?'pg-correct':'pg-missed');
}

function startGame(){
  document.getElementById('screenStart').classList.remove('active');
  document.getElementById('gameArea').style.display='flex';
  queue = getNextSession();
  currentIdx=0; totalScore=0; roundScores=[]; streak=0; updateStreakIndicator();
  initProgressSegments();
  startSound();
  loadAnimal();
}

function loadAnimal(){
  answered=false; revealPct=0; bonusCaptured=false; currentBonus=BONUS_MAX;
  part1Found=false; part2Found=false;
  const animal = queue[currentIdx];
  const img = document.getElementById('photoImg');
  img.className='photo-img hide';
  const canvas=document.getElementById('revealCanvas');
  const container=document.getElementById('photoContainer');
  canvas.width=container.offsetWidth; canvas.height=container.offsetHeight;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
  img.src = animal.src;
  const inp=document.getElementById('answerInput');
  inp.value=''; inp.className=''; inp.disabled=false;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('skipBtn').disabled=false;
  document.getElementById('roundLabel').textContent=`ANIMAL ${currentIdx+1} / ${queue.length}`;
  document.getElementById('photoContainer').className='photo-container';
  document.getElementById('animalTitle').style.display='none';
  document.getElementById('animalTitle').textContent='';
  updateBadge();
  function onReady(){
    if(answered) return;
    img.className='photo-img ready';
    drawMask(0); startReveal(); inp.focus();
  }
  img.onerror=onReady;
  if(img.complete && img.naturalWidth>0) onReady();
  else { img.onload=onReady; setTimeout(()=>{if(!answered&&revealPct===0)onReady();},5000); }
}

function updateBadge(){
  const animal = queue[currentIdx];
  const isDouble = animal.part2 !== null;
  const badge = document.getElementById('ptsBadge');
  const fixedEl = document.getElementById('ptsFixed');
  const bonusEl = document.getElementById('ptsBonus');
  if(isDouble){
    let fixedTotal = (part1Found?FIXED_DOUBLE:0) + (part2Found?FIXED_DOUBLE:0);
    let remaining = (!part1Found?FIXED_DOUBLE:0) + (!part2Found?FIXED_DOUBLE:0);
    fixedEl.textContent = fixedTotal > 0 ? `${fixedTotal} pts` : '';
    bonusEl.textContent = `+${currentBonus}`;
    badge.className = 'pts-badge' + (part1Found||part2Found?' half':'');
  } else {
    fixedEl.textContent = '';
    bonusEl.textContent = `+${currentBonus}`;
    badge.className = 'pts-badge';
  }
}

function drawMask(pct){
  const canvas=document.getElementById('revealCanvas');
  const container=document.getElementById('photoContainer');
  canvas.width=container.offsetWidth; canvas.height=container.offsetHeight;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
  const cx=canvas.width/2, cy=canvas.height/2;
  const frac=0.08+(1-0.08)*(pct/100);
  ctx.clearRect(cx-canvas.width*frac/2, cy-canvas.height*frac/2, canvas.width*frac, canvas.height*frac);
  const pi=Math.round(pct);
  document.getElementById('revealPct').textContent=pi+'% révélé';
  document.getElementById('timerFill').style.width=pct+'%';
  document.getElementById('timerLabel').textContent=pi+'%';
  document.getElementById('timerFill').classList.toggle('urgent',pct>70);
  // Mettre à jour le bonus qui décroît
  if(!bonusCaptured){
    currentBonus = Math.max(0, Math.round(BONUS_MAX*(1-pct/100)));
    updateBadge();
  }
}

function startReveal(){
  if(revealInterval) clearInterval(revealInterval);
  revealInterval=setInterval(()=>{
    if(answered) return;
    revealPct=Math.min(100,revealPct+REVEAL_STEP);
    drawMask(revealPct);
    document.getElementById('headerScore').textContent=totalScore;
    if(revealPct>=100){
      clearInterval(revealInterval);
      if(!answered){
        answered=true;
        handleStreakBreak();
        markProgressSegment(currentIdx, (part1Found||part2Found) ? 'partial' : false);
        playWrong();
        document.getElementById('photoImg').className='photo-img ready';
        const canvas=document.getElementById('revealCanvas');
        canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
        document.getElementById('feedback').textContent='';
        const animal=queue[currentIdx];
        document.getElementById('animalTitle').textContent=animal.title;
        document.getElementById('animalTitle').style.display='block';
        const pts = (part1Found?FIXED_DOUBLE:0)+(part2Found?FIXED_DOUBLE:0);
        roundScores.push({title:animal.title, pts, bonus:0, missed:true, partial:part1Found||part2Found});
        setTimeout(nextAnimal,2000);
      }
    }
  },TICK_MS);
}

document.getElementById('answerInput').addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  if(answered) return;
  AC.resume();
  const animal=queue[currentIdx];
  const inp=this;
  const isDouble = animal.part2 !== null;

  if(!isDouble){
    // Nom simple
    let matched=false, wasFuzzy=false;
    for(const alias of animal.part1){
      const r=isFuzzyMatch(inp.value, alias);
      if(r==='exact'){matched=true;wasFuzzy=false;break;}
      if(r==='fuzzy'){matched=true;wasFuzzy=true;}
    }
    if(matched) triggerCorrectSimple(animal,inp,wasFuzzy);
    else triggerWrong(inp);
  } else {
    // Nom double
    // Vérifier d'abord si l'input matche le nom complet (toutes combinaisons p1+p2)
    let fullMatch = false, fullFuzzy = false;
    for(const a1 of animal.part1){
      for(const a2 of animal.part2){
        const combined1 = a1 + ' ' + a2;
        const combined2 = a2 + ' ' + a1;
        const r1 = isFuzzyMatch(inp.value, combined1);
        const r2 = isFuzzyMatch(inp.value, combined2);
        if(r1==='exact'||r2==='exact'){ fullMatch=true; fullFuzzy=false; break; }
        if(r1==='fuzzy'||r2==='fuzzy'){ fullMatch=true; fullFuzzy=true; }
      }
      if(fullMatch && !fullFuzzy) break;
    }
    if(fullMatch){
      // Valide les deux parties d'un coup
      if(!bonusCaptured){ bonusCaptured=true; }
      if(!part1Found){ part1Found=true; totalScore+=FIXED_DOUBLE; }
      if(!part2Found){ part2Found=true; totalScore+=FIXED_DOUBLE; }
      const bonus = currentBonus;
      totalScore+=bonus;
      document.getElementById('headerScore').textContent=totalScore;
      showScorePopup('+'+(FIXED_DOUBLE*2+bonus)+' pts','green');
      handleStreakSuccess();
      markProgressSegment(currentIdx, true);
      clearInterval(revealInterval); answered=true;
      inp.disabled=true; inp.className='correct';
      playCorrect();
      const pc=document.getElementById('photoContainer');
      pc.classList.remove('flash-half');
      pc.classList.add('flash-correct','correct-flash');
      document.getElementById('photoImg').className='photo-img ready';
      const canvas=document.getElementById('revealCanvas');
      canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
      document.getElementById('animalTitle').textContent=animal.title;
      document.getElementById('animalTitle').style.display='block';
      document.getElementById('skipBtn').disabled=true;
      document.getElementById('feedback').textContent='';
      document.getElementById('feedback').className='feedback ok';
      roundScores.push({title:animal.title, pts:FIXED_DOUBLE*2, bonus, missed:false, partial:false});
      setTimeout(()=>{pc.classList.remove('correct-flash');nextAnimal();},1800);
      return;
    }

    let matchedP1=false, matchedP2=false, fuzzy=false;
    {
      const r=matchesAnyAlias(inp.value, animal.part1);
      matchedP1=r.matched; if(r.fuzzy) fuzzy=true;
    }
    {
      const r=matchesAnyAlias(inp.value, animal.part2);
      matchedP2=r.matched; if(r.fuzzy) fuzzy=true;
    }

    if(!matchedP1 && !matchedP2){ triggerWrong(inp); return; }

    // Capturer le bonus à la première bonne réponse
    if(!bonusCaptured){ bonusCaptured=true; }

    if(matchedP1 && !part1Found){
      const firstFound=!part2Found;
      part1Found=true;
      const earned=FIXED_DOUBLE;
      totalScore+=earned;
      document.getElementById('headerScore').textContent=totalScore;
      if(firstFound) showScorePopup('+'+earned+' pts','orange');
      playHalf();
      inp.value=''; inp.className='half';
      const pc=document.getElementById('photoContainer');
      pc.classList.add('flash-half','half-flash');
      setTimeout(()=>pc.classList.remove('half-flash'),700);
      document.getElementById('feedback').textContent='';
      document.getElementById('feedback').className='feedback half';
      document.getElementById('animalTitle').textContent='(50 / 100 pts)';
      document.getElementById('animalTitle').style.display='block';
      updateBadge();
    }
    if(matchedP2 && !part2Found){
      const firstFound=!part1Found;
      part2Found=true;
      const earned=FIXED_DOUBLE;
      totalScore+=earned;
      document.getElementById('headerScore').textContent=totalScore;
      if(firstFound) showScorePopup('+'+earned+' pts','orange');
      inp.value=''; inp.className='half';
      const pc=document.getElementById('photoContainer');
      pc.classList.add('flash-half','half-flash');
      setTimeout(()=>pc.classList.remove('half-flash'),700);
      document.getElementById('feedback').textContent='';
      document.getElementById('feedback').className='feedback half';
      document.getElementById('animalTitle').textContent='(50 / 100 pts)';
      document.getElementById('animalTitle').style.display='block';
      updateBadge();
    }

    // Les deux parties trouvées ?
    if(part1Found && part2Found){
      // Ajouter le bonus
      const bonus = bonusCaptured ? currentBonus : 0;
      totalScore+=bonus;
      document.getElementById('headerScore').textContent=totalScore;
      showScorePopup('+'+(FIXED_DOUBLE*2+bonus)+' pts','green');
      handleStreakSuccess();
      markProgressSegment(currentIdx, true);
      clearInterval(revealInterval); answered=true;
      inp.disabled=true; inp.className='correct';
      playCorrect();
      const pc=document.getElementById('photoContainer');
      pc.classList.remove('flash-half');
      pc.classList.add('flash-correct','correct-flash');
      document.getElementById('photoImg').className='photo-img ready';
      const canvas=document.getElementById('revealCanvas');
      canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
      document.getElementById('skipBtn').disabled=true;
      document.getElementById('animalTitle').textContent=animal.title;
      document.getElementById('animalTitle').style.display='block';
      document.getElementById('feedback').textContent='';
      document.getElementById('feedback').className='feedback ok';
      roundScores.push({title:animal.title, pts:FIXED_DOUBLE*2, bonus, missed:false, partial:false});
      setTimeout(()=>{pc.classList.remove('correct-flash');nextAnimal();},1800);
    }
  }
});

function showScorePopup(text, variant, sublabel){
  const el=document.getElementById('scorePopup');
  el.classList.remove('show');
  el.style.animationDuration='';
  el.style.fontSize='';
  void el.offsetWidth;
  el.innerHTML = sublabel ? (text+'<div class="score-popup-sub">'+sublabel+'</div>') : text;
  if(variant==='orange'){
    el.style.color='#f5a623';
    el.style.textShadow='0 0 24px rgba(245,166,35,0.65), 0 2px 6px rgba(0,0,0,0.85)';
  } else if(variant==='green'){
    el.style.color='#6abf69';
    el.style.textShadow='0 0 24px rgba(106,191,105,0.65), 0 2px 6px rgba(0,0,0,0.85)';
  } else if(variant==='streak'){
    el.style.color='#ff6a3d';
    el.style.textShadow='0 0 30px rgba(255,106,61,0.8), 0 3px 10px rgba(0,0,0,0.9)';
    el.style.fontSize='clamp(4.5rem, 22vw, 11rem)';
  } else if(variant==='streak-heaven'){
    el.style.color='#fffbe8';
    el.style.textShadow='0 0 40px rgba(255,245,200,0.95), 0 0 90px rgba(255,215,120,0.65)';
    el.style.fontSize='clamp(4.5rem, 22vw, 11rem)';
    el.style.animationDuration='3.8s';
  } else {
    el.style.color='';
    el.style.textShadow='';
  }
  el.classList.add('show');
}

function triggerCorrectSimple(animal,inp,wasFuzzy){
  clearInterval(revealInterval); answered=true;
  const bonus = currentBonus;
  const earned = FIXED_SIMPLE + bonus;
  totalScore+=earned;
  showScorePopup('+'+earned+' pts');
  handleStreakSuccess();
  markProgressSegment(currentIdx, true);
  inp.className='correct'; inp.disabled=true;
  playCorrect();
  const pc=document.getElementById('photoContainer');
  pc.classList.add('flash-correct','correct-flash');
  document.getElementById('photoImg').className='photo-img ready';
  const canvas=document.getElementById('revealCanvas');
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('headerScore').textContent=totalScore;
  document.getElementById('skipBtn').disabled=true;
  document.getElementById('animalTitle').textContent=animal.title;
  document.getElementById('animalTitle').style.display='block';
  const fb=document.getElementById('feedback');
  fb.textContent=`${wasFuzzy?'~':''}`;
  fb.className='feedback ok';
  roundScores.push({title:animal.title, pts:FIXED_SIMPLE, bonus, missed:false, partial:false});
  setTimeout(()=>{pc.classList.remove('correct-flash');nextAnimal();},1500);
}

function triggerWrong(inp){
  playWrong(); inp.className='wrong'; inp.select();
  const pc=document.getElementById('photoContainer');
  pc.classList.add('flash-wrong','shaking');
  pc.addEventListener('animationend',()=>pc.classList.remove('shaking','flash-wrong'),{once:true});
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback ko';
  setTimeout(()=>{inp.className='';},600);
}

function skipAnimal(){
  if(answered) return;
  clearInterval(revealInterval); answered=true;
  handleStreakBreak();
  markProgressSegment(currentIdx, (part1Found||part2Found) ? 'partial' : false);
  playWrong();
  const animal=queue[currentIdx];
  const pts=(part1Found?FIXED_DOUBLE:0)+(part2Found?FIXED_DOUBLE:0);
  roundScores.push({title:animal.title, pts, bonus:0, missed:false, partial:part1Found||part2Found, skipped:true});
  document.getElementById('photoImg').className='photo-img ready';
  const canvas=document.getElementById('revealCanvas');
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('feedback').textContent='';
  document.getElementById('animalTitle').textContent=queue[currentIdx].title;
  document.getElementById('animalTitle').style.display='block';
  document.getElementById('answerInput').disabled=true;
  document.getElementById('skipBtn').disabled=true;
  setTimeout(nextAnimal,1500);
}

function nextAnimal(){ currentIdx++; if(currentIdx>=queue.length) endGame(); else loadAnimal(); }

function endGame(){
  clearInterval(revealInterval);
  document.getElementById('gameArea').style.display='none';
  document.body.classList.add('score-visible');
  document.getElementById('screenEnd').classList.add('active');
  window.scrollTo(0,0);
  const maxPossible = queue.reduce((s,a)=>s+(a.part2?FIXED_DOUBLE*2:FIXED_SIMPLE)+BONUS_MAX,0);
  const pct=Math.round((totalScore/maxPossible)*100);
  document.getElementById('endTitle').textContent=totalScore+' pts';
  document.getElementById('endSub').textContent='';
  document.getElementById('breakdown').innerHTML=roundScores.map(r=>{
    const rowClass = r.partial ? 'half-scored' : (r.pts>0 ? 'scored' : 'missed');
    const ptsDisplay = r.skipped ? 'PASSÉ' : r.missed&&r.pts===0 ? 'MANQUÉ' : `+${r.pts+(r.bonus||0)}`;
    return `<div class="breakdown-row ${rowClass}">
      <span>${r.title}</span>
      <span class="pts">${ptsDisplay}</span>
    </div>`;
  }).join('');
}

function restartGame(){
  document.body.classList.remove('score-visible');
  document.getElementById('screenEnd').classList.remove('active');
  document.getElementById('headerScore').textContent='0';
  document.getElementById('gameArea').style.display='flex';
  queue=getNextSession(); currentIdx=0; totalScore=0; roundScores=[]; streak=0; updateStreakIndicator();
  initProgressSegments();
  startSound();
  loadAnimal();
}

// ── Son ambiance ─────────────────────────────────────────────────
const SOUND_SRC = 'foret.mp3';
const SOUND_DURATION = 20 * 60;
const SOUND_SAFE_END = SOUND_DURATION - 5 * 60;
let soundAudio = null;
let soundMuted = false;

function initSound(){
  if(!soundAudio){
    soundAudio = new Audio(SOUND_SRC);
    soundAudio.loop = false;
    soundAudio.volume = 0.12;
  }
}
function startSound(){
  initSound();
  soundAudio.currentTime = Math.random() * SOUND_SAFE_END;
  soundAudio.muted = soundMuted;
  soundAudio.play().catch(()=>{});
}
function toggleSound(){
  initSound();
  soundMuted = !soundMuted;
  soundAudio.muted = soundMuted;
  const wave1 = document.getElementById('wave1');
  const wave2 = document.getElementById('wave2');
  const btn = document.getElementById('soundBtn');
  if(soundMuted){
    wave1.style.display='none'; wave2.style.display='none';
    btn.style.color='var(--gray)'; btn.style.opacity='0.5';
  } else {
    wave1.style.display=''; wave2.style.display='';
    btn.style.color='var(--accent)'; btn.style.opacity='1';
  }
}

function goHome(){ document.body.classList.remove('score-visible'); window.location.href='index.html'; }
</script>
</body>
