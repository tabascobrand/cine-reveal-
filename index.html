<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REVEAL</title>
<link rel="icon" type="image/png" href="favicon.ico.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --white: #f0eeea; --gray: #444455; --dim: #1e1e2e;
    --gold: #f5c842;
  }
  body {
    background: var(--bg); color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4rem; letter-spacing: 10px;
    color: var(--white); margin-bottom: 8px;
  }
  .subtitle {
    font-size: 0.7rem; letter-spacing: 4px; text-transform: uppercase;
    color: var(--gray); margin-bottom: 56px;
  }
  .cards {
    display: flex; flex-direction: column; gap: 16px;
    width: 100%; max-width: 360px;
  }
  .card {
    border: 1px solid var(--gold); border-radius: 2px;
    padding: 24px 28px; cursor: pointer;
    transition: all 0.2s; text-decoration: none;
    display: flex; flex-direction: column; gap: 5px;
  }
  .card:hover { background: rgba(245,200,66,0.06); transform: translateY(-2px); }
  .card.soon {
    border-color: var(--dim); cursor: default; opacity: 0.35;
    pointer-events: none;
  }
  .card-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem; letter-spacing: 4px; color: var(--gold);
  }
  .card.soon .card-name { color: var(--gray); }
  .card-desc {
    font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gray);
  }
</style>
</head>
<body>
  <div class="title">REVEAL</div>
  <div class="cards">
    <a class="card" href="cine.html">
      <div class="card-name">CINÉ REVEAL</div>
    </a>
    <a class="card" href="animal.html">
      <div class="card-name">ANIMAL REVEAL</div>
    </a>
    <div class="card soon">
      <div class="card-name">FOOD REVEAL</div>
    </div>
    <div class="card soon">
      <div class="card-name">PEOPLE REVEAL</div>
    </div>
    <div class="card soon">
      <div class="card-name">OBJECT REVEAL</div>
    </div>
  </div>
</body>
</html>
